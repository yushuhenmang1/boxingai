# Internet Archive 下载中转（GitHub Actions 版）
#
# ── 为什么可行（2026-09-23 实测）──────────────────────────────
#   本机 → archive.org：三层封锁（主站 IP 阻断 / TLS SNI 阻断 / HTTP Host 头阻断）
#   本机 → GitHub：全链路可达（github.com / raw.githubusercontent.com / api.github.com 均 200）
#   GitHub Actions 运行器在境外 → 可正常访问 archive.org
#   故：Actions 代下 → 提交回仓库 → 本机从 raw.githubusercontent.com 直取（无需 token）
#
# ── 放置位置 ─────────────────────────────────────────────────
#   你自己 GitHub 仓库的：.github/workflows/ia-fetch.yml
#
# ── 用法 ─────────────────────────────────────────────────────
#   Actions 页面 → 左侧选 IA Fetch → Run workflow：
#     · search：archive.org 搜索式，多个查询用 ;; 分隔（默认已预填 V-Five 系列探测式）
#     · urls  ：要下载的 URL，每行一个（建议优先 *_djvu.txt）
#   两者可同时填（先搜索发现 identifier，再另跑一次下载）。
#
# ── 重要提示 ────────────────────────────────────────────────
#   ① 优先下 **_djvu.txt**（OCR 文本，通常几百 KB～2MB），而非扫描 PDF——
#      GitHub 单文件上限 100MB，且我们真正需要的是文本内容（翻译/精读）。
#      直链格式：https://archive.org/download/<identifier>/<identifier>_djvu.txt
#      （Actions 内走 archive.org 主站是通的，无需 ia*.us.archive.org）
#   ② 私有仓库 raw 拉取需 token；建议仓库设为 Public。

name: IA Fetch

on:
  workflow_dispatch:
    inputs:
      search:
        description: 'archive.org 搜索式（多查询用 ;; 分隔）'
        required: false
        type: string
        default: 'identifier:TheNavalAviationPhysicalTrainingManuals* ;; title:("naval aviation physical training") ;; title:(boxing) AND date:[1930-01-01 TO 1960-12-31]'
      urls:
        description: '要下载的 URL（每行一个；建议优先 *_djvu.txt）'
        required: false
        type: string
        default: ''
      note:
        description: '本次任务说明（写入 MANIFEST.md）'
        required: false
        type: string
        default: 'ia-fetch'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: mkdir -p ia_downloads

      - name: Search archive.org (identifier discovery)
        if: ${{ inputs.search != '' }}
        env:
          SEARCH: ${{ inputs.search }}
        run: |
          set -uo pipefail
          n=0
          # 多查询以 ;; 分隔（同时兼容换行分隔）
          printf '%s' "$SEARCH" | sed 's/;;/\n/g' | while IFS= read -r q; do
            q="$(printf '%s' "$q" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -z "$q" ] && continue
            n=$((n+1))
            echo "=== query $n: $q"
            Q=$(jq -rn --arg s "$q" '$s|@uri')
            if curl -sS -L -m 180 \
              "https://archive.org/advancedsearch.php?q=${Q}&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=year&fl%5B%5D=mediatype&rows=100&page=1&output=json" \
              -o "ia_downloads/search_${n}.json" ; then
              cnt=$(jq -r '.response.numFound' "ia_downloads/search_${n}.json" 2>/dev/null || echo "?")
              echo "  numFound=$cnt"
              jq -r '.response.docs[] | "\(.identifier) | \(.title) | \(.year) | \(.mediatype)"' \
                "ia_downloads/search_${n}.json" 2>/dev/null | tee "ia_downloads/search_${n}.txt" || true
            else
              echo "  !! query failed (network)"
            fi
          done

      - name: Download files
        if: ${{ inputs.urls != '' }}
        env:
          URLS: ${{ inputs.urls }}
        run: |
          set -uo pipefail
          i=0; ok=0; fail=0
          printf '%s' "$URLS" | while IFS= read -r u; do
            u="$(printf '%s' "$u" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; s/\r//')"
            [ -z "$u" ] && continue
            i=$((i+1))
            name="$(basename "${u%%\?*}" | sed 's/%20/_/g' | tr -cd 'A-Za-z0-9._-')"
            [ -z "$name" ] && name="file_$i"
            out="ia_downloads/${i}_${name}"
            echo "[$i] $u"
            if curl -L --fail --retry 3 --retry-delay 5 -m 1200 \
                 -A "Mozilla/5.0 (compatible; ia-fetch-actions)" \
                 -o "$out" "$u" ; then
              echo "  ok $(du -h "$out" | cut -f1)"
            else
              echo "  !! FAILED"
              rm -f "$out"
            fi
          done
          echo "--- downloaded ---"
          ls -lh ia_downloads/ || true

      - name: Write manifest
        run: |
          {
            echo "# IA Fetch manifest"
            echo ""
            echo "- time: $(date -u +%FT%TZ)"
            echo "- note: ${{ inputs.note }}"
            echo ""
            echo "| file | size |"
            echo "|---|---|"
            find ia_downloads -maxdepth 1 -type f | sort | while read -r f; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } > ia_downloads/MANIFEST.md
          echo "--- result ---"
          find ia_downloads -maxdepth 1 -type f -exec du -h {} \; | sort -k2

      - name: Commit back
        run: |
          git config user.name "ia-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f ia_downloads
          git commit -m "ia-fetch: ${{ inputs.note }} [${{ github.run_id }}]" || echo "nothing to commit"
          git push
